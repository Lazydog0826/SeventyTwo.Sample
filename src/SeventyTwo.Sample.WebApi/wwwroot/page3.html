<!DOCTYPE html>
<!--suppress CssUnusedSymbol, ExceptionCaughtLocallyJS -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单游标分页测试</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            color: #1f2937;
            background: #f3f4f6;
            font: 14px/1.5 system-ui, sans-serif;
        }

        main {
            display: flex;
            width: min(1400px, calc(100% - 32px));
            height: calc(100vh - 32px);
            margin: 16px auto;
            flex-direction: column;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .subtitle {
            margin: 6px 0 24px;
            color: #6b7280;
        }

        .nav, .toolbar, .pager {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav {
            margin-bottom: 16px;
        }

        .nav a {
            color: #2563eb;
            text-decoration: none;
        }

        .nav a[aria-current="page"] {
            color: #111827;
            font-weight: 600;
        }

        .panel {
            display: flex;
            min-height: 0;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 1px 2px rgb(0 0 0 / 5%);
            flex: 1;
            flex-direction: column;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input, select, button {
            height: 36px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            font: inherit;
        }

        input {
            width: 180px;
            padding: 0 10px;
        }

        select {
            padding: 0 28px 0 10px;
        }

        button {
            padding: 0 14px;
            cursor: pointer;
        }

        button.primary {
            border-color: #2563eb;
            color: #fff;
            background: #2563eb;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .45;
        }

        .status {
            min-height: 22px;
            margin: 14px 0 8px;
            color: #6b7280;
        }

        .status.error {
            color: #dc2626;
        }

        .cursor {
            padding: 8px 10px;
            border-radius: 6px;
            color: #4b5563;
            background: #f9fafb;
            font-family: ui-monospace, monospace;
            overflow-wrap: anywhere;
        }

        .table-wrap {
            min-height: 0;
            overflow: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 11px 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 1;
            color: #4b5563;
            background: #f9fafb;
            font-weight: 600;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .empty {
            padding: 36px;
            color: #9ca3af;
            text-align: center;
        }

        .pager {
            justify-content: flex-end;
            margin-top: 16px;
        }

        .pager span {
            color: #6b7280;
        }
    </style>
</head>
<body>
<main>
    <nav class="nav">
        <a href="page1.html">普通分页</a>
        <a href="page2.html">索引回表分页</a>
        <a href="page3.html" aria-current="page">游标分页</a>
    </nav>
    <h1>订单游标分页</h1>
    <p class="subtitle">测试 <code>POST /api/orders/page/cursor</code>，使用上一页末条订单的创建时间和 ID 查询下一页。</p>
    <section class="panel">
        <form id="queryForm" class="toolbar">
            <label>手机号前缀 <input id="receiverPhone" type="text" placeholder="可选"></label>
            <label>每页数量
                <select id="limit">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </label>
            <button class="primary" type="submit">重新查询</button>
        </form>
        <div id="status" class="status">准备查询</div>
        <div id="cursorInfo" class="cursor">当前请求游标：无（第一页）</div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>订单编号</th>
                    <th>客户 ID</th>
                    <th>仓库 ID</th>
                    <th>类型</th>
                    <th>状态</th>
                    <th>收货人</th>
                    <th>手机号</th>
                    <th>地址</th>
                </tr>
                </thead>
                <tbody id="orderRows"></tbody>
            </table>
        </div>
        <div class="pager">
            <span id="pageInfo">第 1 页</span>
            <button id="previousButton" type="button">上一页</button>
            <button id="nextButton" type="button">下一页</button>
        </div>
    </section>
</main>
<script>
    const endpoint = "/api/orders/page/cursor";
    const typeNames = {1: "销售", 2: "退货", 3: "调拨", Sales: "销售", Return: "退货", Transfer: "调拨"};
    const statusNames = {
        0: "待处理",
        1: "处理中",
        2: "已处理",
        3: "已取消",
        Pending: "待处理",
        Processing: "处理中",
        Processed: "已处理",
        Cancelled: "已取消"
    };
    const state = {
        page: 1,
        loading: false,
        limit: 10,
        receiverPhone: "",
        requestCursor: null,
        nextCursor: null,
        history: []
    };
    const form = document.querySelector("#queryForm");
    const queryButton = form.querySelector('button[type="submit"]');
    const rows = document.querySelector("#orderRows");
    const status = document.querySelector("#status");
    const cursorInfo = document.querySelector("#cursorInfo");
    const pageInfo = document.querySelector("#pageInfo");
    const previousButton = document.querySelector("#previousButton");
    const nextButton = document.querySelector("#nextButton");

    function escapeHtml(value) {
        const element = document.createElement("div");
        element.textContent = value ?? "";
        return element.innerHTML;
    }

    function getPage(payload) {
        return payload?.data ?? payload?.result ?? payload;
    }

    function render(items) {
        if (!items.length) {
            rows.innerHTML = '<tr><td class="empty" colspan="9">暂无订单</td></tr>';
            return;
        }
        rows.innerHTML = items.map(order => {
            const address = [order.province, order.city, order.district, order.detailAddress].filter(Boolean).join(" ");
            return `<tr><td>${escapeHtml(order.id)}</td><td>${escapeHtml(order.orderNo)}</td><td>${escapeHtml(order.customerId)}</td><td>${escapeHtml(order.warehouseId)}</td><td>${escapeHtml(typeNames[order.orderType] ?? order.orderType)}</td><td>${escapeHtml(statusNames[order.orderStatus] ?? order.orderStatus)}</td><td>${escapeHtml(order.receiverName)}</td><td>${escapeHtml(order.receiverPhone)}</td><td title="${escapeHtml(address)}">${escapeHtml(address)}</td></tr>`;
        }).join("");
    }

    function updatePager(limit) {
        queryButton.disabled = state.loading;
        pageInfo.textContent = `第 ${state.page} 页，每页 ${limit} 条`;
        previousButton.disabled = state.loading || state.history.length === 0;
        nextButton.disabled = state.loading || !state.nextCursor;
        cursorInfo.textContent = state.requestCursor
            ? `当前请求游标：${state.requestCursor.lastDateTime} / ${state.requestCursor.lastId}`
            : "当前请求游标：无（第一页）";
    }

    async function query() {
        const {limit, receiverPhone} = state;
        state.loading = true;
        status.className = "status";
        status.textContent = "查询中...";
        updatePager(limit);
        const startedAt = performance.now();
        try {
            const request = {limit, receiverPhone};
            if (state.requestCursor) Object.assign(request, state.requestCursor);
            const response = await fetch(endpoint, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(request)
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload?.message ?? `请求失败：HTTP ${response.status}`);
            const page = getPage(payload);
            const items = page?.list ?? [];
            state.nextCursor = page?.hasNext && page?.lastDateTime != null && page?.lastId != null
                ? {lastDateTime: page.lastDateTime, lastId: page.lastId}
                : null;
            const requestElapsed = Math.round(performance.now() - startedAt);
            const renderStartedAt = performance.now();
            render(items);
            const renderElapsed = Math.round(performance.now() - renderStartedAt);
            status.textContent = `本页 ${items.length} 条，接口 ${requestElapsed} ms，渲染 ${renderElapsed} ms`;
        } catch (error) {
            rows.innerHTML = '<tr><td class="empty" colspan="9">查询失败</td></tr>';
            state.nextCursor = null;
            status.className = "status error";
            status.textContent = error.message;
        } finally {
            state.loading = false;
            updatePager(limit);
        }
    }

    form.addEventListener("submit", event => {
        event.preventDefault();
        if (state.loading) return;
        Object.assign(state, {
            page: 1,
            limit: Number(document.querySelector("#limit").value),
            receiverPhone: document.querySelector("#receiverPhone").value.trim(),
            requestCursor: null,
            nextCursor: null,
            history: []
        });
        query();
    });
    previousButton.addEventListener("click", () => {
        state.requestCursor = state.history.pop() ?? null;
        state.page--;
        query();
    });
    nextButton.addEventListener("click", () => {
        state.history.push(state.requestCursor);
        state.requestCursor = state.nextCursor;
        state.page++;
        query();
    });
    query();
</script>
</body>
</html>
