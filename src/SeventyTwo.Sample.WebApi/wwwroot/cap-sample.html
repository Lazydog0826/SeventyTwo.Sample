<!DOCTYPE html>
<!--suppress ExceptionCaughtLocallyJS, CssUnusedSymbol -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAP 队列测试</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #1f2937;
            background: #f3f4f6;
            font: 14px/1.5 system-ui, sans-serif;
        }

        main {
            width: min(760px, calc(100% - 32px));
            margin: 48px auto;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .subtitle {
            margin: 6px 0 24px;
            color: #6b7280;
        }

        .panel {
            padding: 24px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 1px 2px rgb(0 0 0 / 5%);
        }

        label {
            display: flex;
            gap: 8px;
            flex-direction: column;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 10px 12px;
            resize: vertical;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font: inherit;
        }

        button {
            height: 40px;
            margin-top: 16px;
            padding: 0 20px;
            border: 1px solid #2563eb;
            border-radius: 6px;
            color: #fff;
            background: #2563eb;
            font: inherit;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .55;
        }

        .status {
            min-height: 22px;
            margin: 18px 0 0;
            color: #6b7280;
        }

        .status.error {
            color: #dc2626;
        }

        .status.success {
            color: #15803d;
        }

        .result {
            display: grid;
            margin-top: 20px;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .result-item {
            min-width: 0;
            padding: 14px;
            border-radius: 8px;
            background: #f9fafb;
        }

        .result-item span {
            display: block;
            color: #6b7280;
            font-size: 12px;
        }

        .result-item strong {
            display: block;
            margin-top: 4px;
            overflow-wrap: anywhere;
        }

        .result-item.full {
            grid-column: 1 / -1;
        }

        .hint {
            margin: 18px 0 0;
            padding: 12px 14px;
            border-radius: 8px;
            color: #475569;
            background: #f1f5f9;
        }

        @media (max-width: 640px) {
            main {
                margin: 24px auto;
            }

            .result {
                grid-template-columns: 1fr;
            }

            .result-item.full {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>CAP 队列测试</h1>
    <p class="subtitle">调用 <code>POST /api/cap-sample/publish</code> 发布持久化消息。</p>
    <section class="panel">
        <form id="publishForm">
            <label for="content">消息内容
                <textarea id="content" required>CAP 静态页面测试消息</textarea>
            </label>
            <button id="publishButton" type="submit">发布消息</button>
        </form>

        <p id="status" class="status">等待发布</p>

        <div class="result">
            <div class="result-item">
                <span>消息标识</span>
                <strong id="messageId">-</strong>
            </div>
            <div class="result-item">
                <span>发布时间</span>
                <strong id="publishedAt">-</strong>
            </div>
            <div class="result-item full">
                <span>消息内容</span>
                <strong id="publishedContent">-</strong>
            </div>
        </div>

        <p class="hint">接口成功表示消息已写入 CAP 持久化存储；消费者处理和 ACK 结果可在服务日志中查看。</p>
    </section>
</main>
<script>
    const endpoint = "/api/cap-sample/publish";
    const form = document.querySelector("#publishForm");
    const contentInput = document.querySelector("#content");
    const publishButton = document.querySelector("#publishButton");
    const status = document.querySelector("#status");
    const messageId = document.querySelector("#messageId");
    const publishedAt = document.querySelector("#publishedAt");
    const publishedContent = document.querySelector("#publishedContent");

    async function getResponsePayload(response) {
        const payload = await response.json();
        if (!response.ok) throw new Error(payload?.message ?? `请求失败：HTTP ${response.status}`);
        return payload?.data ?? payload?.result ?? payload;
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();
        const content = contentInput.value.trim();
        if (!content) {
            status.className = "status error";
            status.textContent = "请输入消息内容。";
            return;
        }

        publishButton.disabled = true;
        contentInput.disabled = true;
        status.className = "status";
        status.textContent = "正在发布消息...";
        try {
            const response = await fetch(endpoint, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({content})
            });
            const message = await getResponsePayload(response);
            messageId.textContent = message.id;
            publishedAt.textContent = new Date(message.publishedAt).toLocaleString("zh-CN");
            publishedContent.textContent = message.content;
            status.className = "status success";
            status.textContent = "消息发布成功。";
        } catch (error) {
            status.className = "status error";
            status.textContent = error.message;
        } finally {
            publishButton.disabled = false;
            contentInput.disabled = false;
        }
    });
</script>
</body>
</html>
