<!DOCTYPE html>
<!--suppress CssUnusedSymbol, ExceptionCaughtLocallyJS -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机订单生成</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #1f2937;
            background: #f3f4f6;
            font: 14px/1.5 system-ui, sans-serif;
        }

        main {
            width: min(760px, calc(100% - 32px));
            margin: 48px auto;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .subtitle {
            margin: 6px 0 24px;
            color: #6b7280;
        }

        .panel {
            padding: 24px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 1px 2px rgb(0 0 0 / 5%);
        }

        .form-row {
            display: flex;
            align-items: end;
            gap: 16px;
            flex-wrap: wrap;
        }

        label {
            display: flex;
            gap: 6px;
            flex-direction: column;
        }

        input, button {
            height: 38px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font: inherit;
        }

        input {
            width: 190px;
            padding: 0 10px;
            background: #fff;
        }

        button {
            padding: 0 18px;
            border-color: #2563eb;
            color: #fff;
            background: #2563eb;
            cursor: pointer;
        }

        input:disabled, button:disabled {
            cursor: not-allowed;
            opacity: .55;
        }

        .progress-wrap {
            margin-top: 28px;
        }

        .progress-header {
            display: flex;
            margin-bottom: 8px;
            justify-content: space-between;
        }

        progress {
            display: block;
            width: 100%;
            height: 18px;
            accent-color: #2563eb;
        }

        .details {
            display: grid;
            margin-top: 20px;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .detail {
            padding: 14px;
            border-radius: 8px;
            background: #f9fafb;
        }

        .detail span {
            display: block;
            color: #6b7280;
            font-size: 12px;
        }

        .detail strong {
            display: block;
            margin-top: 4px;
            font-size: 18px;
        }

        .status {
            min-height: 22px;
            margin: 18px 0 0;
            color: #6b7280;
        }

        .status.error {
            color: #dc2626;
        }

        .status.success {
            color: #15803d;
        }

        @media (max-width: 640px) {
            main {
                margin: 24px auto;
            }

            .form-row label, input, button {
                width: 100%;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>随机订单生成</h1>
    <p class="subtitle">按批次串行调用 <code>POST /api/orders/random</code>。</p>
    <section class="panel">
        <form id="generateForm" class="form-row">
            <label>本次新增总数
                <input id="totalCount" type="number" min="1" step="1" value="90000000" required>
            </label>
            <label>每批数量
                <input id="batchSize" type="number" min="1" step="1" value="10000" required>
            </label>
            <button id="startButton" type="submit">开始生成</button>
        </form>

        <div class="progress-wrap">
            <div class="progress-header">
                <span>执行进度</span>
                <strong id="percentage">0.00%</strong>
            </div>
            <progress id="progress" value="0" max="100"></progress>
        </div>

        <div class="details">
            <div class="detail">
                <span>已完成数量</span>
                <strong id="completedCount">0</strong>
            </div>
            <div class="detail">
                <span>已完成批次</span>
                <strong id="completedBatch">0 / 0</strong>
            </div>
            <div class="detail">
                <span>累计耗时</span>
                <strong id="elapsed">00:00:00</strong>
            </div>
        </div>

        <p id="status" class="status">等待开始</p>
    </section>
</main>
<script>
    const endpoint = "/api/orders/random";
    const form = document.querySelector("#generateForm");
    const totalCountInput = document.querySelector("#totalCount");
    const batchSizeInput = document.querySelector("#batchSize");
    const startButton = document.querySelector("#startButton");
    const progress = document.querySelector("#progress");
    const percentage = document.querySelector("#percentage");
    const completedCount = document.querySelector("#completedCount");
    const completedBatch = document.querySelector("#completedBatch");
    const elapsed = document.querySelector("#elapsed");
    const status = document.querySelector("#status");
    let running = false;
    let timerId = null;

    function formatNumber(value) {
        return new Intl.NumberFormat("zh-CN").format(value);
    }

    function formatElapsed(milliseconds) {
        const totalSeconds = Math.floor(milliseconds / 1000);
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
        const minutes = String(Math.floor(totalSeconds % 3600 / 60)).padStart(2, "0");
        const seconds = String(totalSeconds % 60).padStart(2, "0");
        return `${hours}:${minutes}:${seconds}`;
    }

    function updateProgress(doneCount, totalCount, doneBatch, totalBatch) {
        const percent = doneCount / totalCount * 100;
        progress.value = percent;
        percentage.textContent = `${percent.toFixed(2)}%`;
        completedCount.textContent = `${formatNumber(doneCount)} / ${formatNumber(totalCount)}`;
        completedBatch.textContent = `${formatNumber(doneBatch)} / ${formatNumber(totalBatch)}`;
    }

    async function getErrorMessage(response) {
        try {
            const payload = await response.json();
            return payload?.message ?? `请求失败：HTTP ${response.status}`;
        } catch {
            return `请求失败：HTTP ${response.status}`;
        }
    }

    async function generate(totalCount, batchSize) {
        const totalBatch = Math.ceil(totalCount / batchSize);
        const startedAt = performance.now();
        let doneCount = 0;
        let doneBatch = 0;

        updateProgress(doneCount, totalCount, doneBatch, totalBatch);
        elapsed.textContent = "00:00:00";
        timerId = window.setInterval(() => {
            elapsed.textContent = formatElapsed(performance.now() - startedAt);
        }, 1000);

        try {
            while (doneCount < totalCount) {
                const currentCount = Math.min(batchSize, totalCount - doneCount);
                status.textContent = `正在执行第 ${formatNumber(doneBatch + 1)} 批，本批 ${formatNumber(currentCount)} 条...`;
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({count: currentCount})
                });
                if (!response.ok) throw new Error(await getErrorMessage(response));

                doneCount += currentCount;
                doneBatch++;
                updateProgress(doneCount, totalCount, doneBatch, totalBatch);
            }

            status.className = "status success";
            status.textContent = `生成完成，共新增 ${formatNumber(doneCount)} 条订单。`;
        } catch (error) {
            status.className = "status error";
            status.textContent = `第 ${formatNumber(doneBatch + 1)} 批失败，已停止：${error.message}`;
        } finally {
            window.clearInterval(timerId);
            elapsed.textContent = formatElapsed(performance.now() - startedAt);
        }
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();
        if (running) return;

        const totalCount = Number(totalCountInput.value);
        const batchSize = Number(batchSizeInput.value);
        if (!Number.isSafeInteger(totalCount) || totalCount <= 0 || !Number.isSafeInteger(batchSize) || batchSize <= 0) {
            status.className = "status error";
            status.textContent = "新增总数和每批数量必须是大于 0 的整数。";
            return;
        }

        running = true;
        totalCountInput.disabled = true;
        batchSizeInput.disabled = true;
        startButton.disabled = true;
        status.className = "status";
        try {
            await generate(totalCount, batchSize);
        } finally {
            running = false;
            totalCountInput.disabled = false;
            batchSizeInput.disabled = false;
            startButton.disabled = false;
        }
    });
</script>
</body>
</html>
